<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft.js</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="overlay">
  <div class="panel">
    <h1>MINECRAFT.JS</h1>
    <div class="sub">HTML + CSS + JAVASCRIPT EDITION</div>
    <table>
      <tr><td>W A S D</td><td>Move</td></tr>
      <tr><td>Mouse</td><td>Look around</td></tr>
      <tr><td>Space</td><td>Jump / Fly up</td></tr>
      <tr><td>Shift</td><td>Fly down</td></tr>
      <tr><td>F</td><td>Toggle fly mode</td></tr>
      <tr><td>Left click</td><td>Break block</td></tr>
      <tr><td>Right click</td><td>Place block</td></tr>
      <tr><td>Middle click</td><td>Pick block</td></tr>
      <tr><td>1-9 / Scroll</td><td>Select block</td></tr>
      <tr><td>Esc</td><td>Release mouse</td></tr>
    </table>
    <div class="play">CLICK TO PLAY</div>
  </div>
</div>
<div id="crosshair"></div>
<div id="hotbar"></div>
<div id="debug"></div>
<script src="vendor/three.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
